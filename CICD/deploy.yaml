name: Build and Deploy Binary to Pi

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Emulate ARM64 architecture on the GitHub Runner
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      # 2. Compile using your builder multi-stage target
      - name: Build Binary inside Docker
        run: |
          docker build --target builder -t borescope-builder .
          docker run --name extract-container borescope-builder true
          docker cp extract-container:/app/out/build/debug/pi-borescope-streamer ./pi-borescope-streamer
          docker rm extract-container

      # 3. Upload to GitHub as an artifact (Sanity check / Backup)
      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pi-borescope-streamer
          path: ./pi-borescope-streamer

      # 4. Deploy directly to your physical Raspberry Pi over SSH
      - name: Copy Binary to Raspberry Pi
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.PI_HOST }}          # Your Pi's public IP or Tailscale IP
          username: ${{ secrets.PI_USERNAME }}  # e.g., pi
          key: ${{ secrets.PI_SSH_KEY }}        # Your SSH Private Key
          target: "/home/${{ secrets.PI_USERNAME }}/"
          source: "./pi-borescope-streamer"
